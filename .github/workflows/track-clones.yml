name: Track Clone Traffic

on:
  schedule:
    # Runs daily at midnight UTC
    - cron: '0 0 * * *'
  # Allows manually triggering the workflow from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-save-clones:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Clone Statistics from GitHub API
        env:
          PAT: ${{ secrets.TRAFFIC_PAT }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p traffic-data
          
          # Query GitHub Traffic API for clone data
          curl -s -H "Authorization: token $PAT" \
               -H "Accept: application/vnd.github.v3+json" \
               "https://api.github.com/repos/$REPO/traffic/clones" > traffic-data/latest-clones.json

      - name: Process and Append Data
        run: |
          python3 -c "
          import json, csv, os

          json_file = 'traffic-data/latest-clones.json'
          csv_file = 'traffic-data/clones_history.csv'

          if not os.path.exists(json_file):
              exit()

          with open(json_file, 'r') as f:
              data = json.load(f)

          clones = data.get('clones', [])
          if not clones:
              exit()

          # Load existing entries to avoid duplicates
          existing_dates = set()
          if os.path.exists(csv_file):
              with open(csv_file, 'r') as f:
                  reader = csv.reader(f)
                  next(reader, None)  # Skip header
                  for row in reader:
                      if row:
                          existing_dates.add(row[0])

          # Append new records
          file_exists = os.path.exists(csv_file)
          with open(csv_file, 'a', newline='') as f:
              writer = csv.writer(f)
              if not file_exists:
                  writer.writerow(['Timestamp', 'Total Clones', 'Unique Cloners'])

              for entry in clones:
                  timestamp = entry['timestamp']
                  if timestamp not in existing_dates:
                      writer.writerow([timestamp, entry['count'], entry['uniques']])
          "

      - name: Commit and Push Updated Data to Dedicated Branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # 1. Save generated file contents to an environment variable in memory
          if [ -f "traffic-data/clones_history.csv" ]; then
            CSV_DATA=$(cat traffic-data/clones_history.csv)
          else
            echo "Error: clones_history.csv was not generated by the Python step."
            exit 1
          fi

          # 2. Switch to or create the orphaned traffic-data branch
          git fetch origin
          if git ls-remote --exit-code --heads origin traffic-data; then
            git checkout traffic-data || git checkout -b traffic-data origin/traffic-data
            git pull origin traffic-data
          else
            git checkout --orphan traffic-data
            git rm -rf .
          fi

          # 3. Re-create directory and write data back
          mkdir -p traffic-data
          printf "%s\n" "$CSV_DATA" > traffic-data/clones_history.csv

          # 4. Stage, check for changes, and push
          git add traffic-data/clones_history.csv

          if git diff --staged --quiet; then
            echo "No new clone data to commit."
          else
            git commit -m "chore: update daily clone traffic data [skip ci]"
            git push origin traffic-data
          fi